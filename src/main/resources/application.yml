server:
  port: ${PORT:8080}

spring:
  application:
    name: military-asset-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/military_asset_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:MilitaryAssetMgmt-ChangeThisSecretKey-32charsMin!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:*}
